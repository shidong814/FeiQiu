name: FeiQiu
options:
  bundleIdPrefix: com.feiqiu
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.7
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_BITCODE: NO

targets:
  FeiQiu:
    type: application
    platform: macOS
    sources:
      - path: FeiQiu-macOS
        excludes:
          - "Info.plist"
    info:
      path: FeiQiu-macOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feiqiu.macos
        PRODUCT_NAME: FeiQiu
        PRODUCT_MODULE_NAME: FeiQiu
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        COMBINE_HIDPI_IMAGES: YES

  FeiQiuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FeiQiuTests
    dependencies:
      - target: FeiQiu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feiqiu.macos.tests

schemes:
  FeiQiu:
    build:
      targets:
        FeiQiu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FeiQiuTests
    archive:
      config: Release
