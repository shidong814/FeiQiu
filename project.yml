name: FeiQiu
options:
  bundleIdPrefix: com.feiqiu
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.7
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  FeiQiu:
    type: application
    platform: iOS
    sources:
      - path: FeiQiu
        excludes:
          - "Info.plist"
    resources:
      - path: FeiQiu/Assets
        optional: true
    info:
      path: FeiQiu/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feiqiu.ios
        PRODUCT_NAME: FeiQiu
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO

  FeiQiuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FeiQiuTests
    dependencies:
      - target: FeiQiu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feiqiu.ios.tests

schemes:
  FeiQiu:
    build:
      targets:
        FeiQiu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FeiQiuTests
    archive:
      config: Release
