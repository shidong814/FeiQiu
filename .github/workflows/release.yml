name: Release DMG

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Install Dependencies
      run: brew install xcodegen
    
    - name: Build DMG
      run: |
        chmod +x scripts/build.sh
        ./scripts/build.sh
    
    - name: Get Tag Name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: FeiQiu-*.dmg
        name: 飞秋 ${{ steps.tag.outputs.tag }}
        body: |
          ## 飞秋 macOS ${{ steps.tag.outputs.tag }}
          
          兼容 IPMSG / Windows 飞秋 / 飞鸽传书的局域网通讯工具。
          
          ### 安装
          1. 下载 DMG 文件
          2. 双击打开
          3. 拖拽飞秋到应用程序文件夹
          4. 首次运行需要在 系统设置 → 隐私与安全 → 本地网络 中允许
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
